name: Live RAW acceptance
on:
  pull_request: {}
  push:
    branches: [main]
    # The code graph document is regenerated after every merge; it changes no build input.
    paths-ignore: [CODEGRAPH.md]
permissions: {contents: read}
# One runner serves every workflow, so a newer push to a pull request replaces its older runs.
# Pushes to main are grouped by commit and never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  live-raw:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - name: Select the provisioned Python 3.12.13 interpreter
        run: |
          test -x /opt/homebrew/opt/python@3.12/bin/python3.12
          echo /opt/homebrew/opt/python@3.12/libexec/bin >> "$GITHUB_PATH"
      - name: Verify the provisioned source-pinned Apple-silicon native route
        run: ./scripts/ci/provision_s47_native_prerequisites.sh
      - name: Build the app with its installed decode helpers
        # build-native.sh installs PhotoCatalogWorker and LensWorksDecodeWorker into
        # .build/xcode-app; the hosted unit tests develop RAW through those helpers.
        run: |
          ./scripts/build-native.sh
          xcodebuild build-for-testing -project native/Compositor.xcodeproj -scheme Compositor -destination 'platform=macOS,arch=arm64' -configuration Debug -derivedDataPath .build/xcode-app CODE_SIGN_IDENTITY=-
          test -x .build/xcode-app/Build/Products/Debug/LensWorks.app/Contents/Helpers/LensWorksDecodeWorker
      - name: Run every S08 live RAW, S09 float renderer and S10 layer graph suite and the S43 HDR merge suite
        # LiveRawSourceMatrixTests is not listed: it needs the licensed, hash-bound camera matrix
        # (LW_S08_RAW_MATRIX), which cannot be checked in, so CI can never execute it.
        timeout-minutes: 60
        env:
          # HDRMergeCatalogTests drives a real catalog; development uses the app's installed helpers.
          TEST_RUNNER_LW_CATALOG_TEST_WORKER: ${{ github.workspace }}/.build/rust-catalog/release/photocatalog
          TEST_RUNNER_LW_CATALOG_TEST_DECODE_WORKER: ${{ github.workspace }}/.build/rust-catalog/release/lensworks-decode-worker
        run: |
          suites=(FloatCameraRawTests TiledFloatCameraRawTests TiledFloatAdmissionTests FloatCoreImageProviderTests
            FloatRetouchTests FloatScratchWriterOwnershipTests LiveRawSourceTests
            LiveRawSampleAllAdmissionTests LiveRawAcceptanceTests
            FloatRendererPrecisionTests FloatTileResidencyTests
            LayerGraphPixelTests LayerGraphOperationTests HDRMergeTests HDRMergeCatalogTests)
          only=(); for suite in "${suites[@]}"; do only+=("-only-testing:CompositorTests/$suite"); done
          ./scripts/ci/xcodebuild_test.sh LiveRawAcceptance.xcresult -project native/Compositor.xcodeproj -scheme Compositor -destination 'platform=macOS,arch=arm64' -derivedDataPath .build/xcode-app -parallel-testing-enabled NO \
            "${only[@]}"
      - name: Refuse a run that executed fewer S08 tests than expected
        if: always()
        # The xcresult summary counts test functions: a parameterized Swift Testing test counts once, however
        # many argument cases it runs (verified against a local result bundle: 14 functions, 107 argument cases).
        # Raise S08_EXPECTED_TESTS when test functions are added; a filter typo, a skipped suite or an empty
        # bundle executes fewer and fails here.
        env: {S08_EXPECTED_TESTS: "306"}
        run: |
          test -d LiveRawAcceptance.xcresult
          xcrun xcresulttool get test-results summary --path LiveRawAcceptance.xcresult --format json > s08-summary.json
          python3 - <<'PY'
          import json, os, sys
          summary = json.load(open("s08-summary.json"))
          executed = summary["passedTests"] + summary["failedTests"]
          expected = int(os.environ["S08_EXPECTED_TESTS"])
          print(f"S08 executed {executed} tests (passed {summary['passedTests']}, failed {summary['failedTests']}, skipped {summary['skippedTests']}); expected at least {expected}")
          sys.exit(0 if executed > 0 and executed >= expected else 1)
          PY
      - name: Upload live RAW test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: live-raw-acceptance, path: LiveRawAcceptance.xcresult, if-no-files-found: ignore, retention-days: 7}
