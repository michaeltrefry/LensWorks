name: S47 procedural photographs and native UI tour
on:
  pull_request: {}
  push:
    branches: [main]
    # The code graph document is regenerated after every merge; it changes no build input.
    paths-ignore: [CODEGRAPH.md]
permissions: {contents: read}
# One runner serves every workflow, so a newer push to a pull request replaces its older runs.
# Pushes to main are grouped by commit and never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  deterministic-fixtures-and-tour:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - name: Pin the selected Xcode SDK and native compiler toolchain
        id: native-toolchain
        run: bash scripts/native-toolchain.sh --github
      - name: Select the provisioned Python 3.12.15 interpreter
        run: |
          test -x /opt/homebrew/opt/python@3.12/bin/python3.12
          /opt/homebrew/opt/python@3.12/bin/python3.12 -c 'import sys; assert sys.version_info[:3] == (3, 12, 15), sys.version'
          echo /opt/homebrew/opt/python@3.12/libexec/bin >> "$GITHUB_PATH"
      - name: Verify the provisioned source-pinned Apple-silicon native route
        run: |
          python3 -c 'import sys; assert sys.version_info[:3] == (3, 12, 15), sys.version'
          ./scripts/ci/provision_s47_native_prerequisites.sh
      - name: Generate and validate procedurally licensed fixtures
        run: |
          python3 -m unittest scripts.tests.test_generate_s47_procedural_photos scripts.tests.test_export_s47_tour_capture
          # Both S47 tours use the one empty private WorkingVersions folder (recreated between them below), so the
          # sidebar's displayed working-version path is identical in both captures.
          python3 scripts/generate_s47_procedural_photos.py --output "$RUNNER_TEMP/s47-fixtures" --seed 25317 --catalog-directory "$RUNNER_TEMP/s47-fixtures/WorkingVersions/Demo.catalog"
          # The three S38 UI tests and the S05 organization UI test each need their own empty private working folder.
          python3 scripts/generate_s47_procedural_photos.py --output "$RUNNER_TEMP/s38-fixtures" --seed 25316 \
            --working-folder WorkingVersions-1 --working-folder WorkingVersions-2 --working-folder WorkingVersions-3 --working-folder WorkingVersions-4
      - name: Audit menu items and shortcuts against the command registry (source)
        # Fails naming any keyboard shortcut, key handler or menu, context-menu or pull-down item that bypasses
        # native/Compositor/Commands. The live-menu half runs after the build.
        run: |
          python3 -m unittest scripts.tests.test_command_registry_audit
          python3 scripts/ci/command_registry_audit.py native/Compositor
      - name: Audit the frozen capability inventory against its sources
        # Re-extracts every source anchor from vendor/Compositor (the submodule checked out above) and engines/catalog
        # and fails when the ledger, its story mapping, its recorded test evidence or its Markdown has drifted.
        run: python3 scripts/audit-capabilities.py
      - name: Build source-bound owned helpers and UI-test scheme
        run: |
          # The embedded inference runtime builds incrementally in the persistent runner cache.
          LW_INFERENCE_TARGET_DIR="$HOME/.cache/lensworks-ci/inference-target" ./scripts/build-native.sh
          test -x .build/rust-catalog/release/photocatalog
          test -x .build/rust-catalog/release/lensworks-decode-worker
          test -x .build/rust-catalog/release/lensworks-mcp
          shasum -a 256 .build/rust-catalog/release/photocatalog .build/rust-catalog/release/lensworks-decode-worker
          xcodebuild build-for-testing -project native/Compositor.xcodeproj -scheme Compositor -destination 'platform=macOS,arch=arm64' -configuration Debug -derivedDataPath .build/xcode-s47 CODE_SIGN_IDENTITY=-
      - name: Audit the live menus and shortcut table against the command registry
        timeout-minutes: 10
        run: |
          ./scripts/ci/xcodebuild_test.sh CommandAudit.xcresult -project native/Compositor.xcodeproj -scheme Compositor -destination 'platform=macOS,arch=arm64' -derivedDataPath .build/xcode-s47 -parallel-testing-enabled NO \
            -only-testing:CompositorTests/CommandAuditTests
      - name: Run the 100k-photo, organization, offline relink, command registry, S38 and S40 automation native tests
        timeout-minutes: 30
        env:
          TEST_RUNNER_LW_CATALOG_TEST_WORKER: ${{ github.workspace }}/.build/rust-catalog/release/photocatalog
          TEST_RUNNER_LW_CATALOG_TEST_DECODE_WORKER: ${{ github.workspace }}/.build/rust-catalog/release/lensworks-decode-worker
          TEST_RUNNER_LW_CATALOG_TEST_ORGANIZATION_PROBE: ${{ github.workspace }}/.build/rust-catalog/release/organization_probe
          TEST_RUNNER_LW_S38_FIXTURE_ROOT: ${{ runner.temp }}/s38-fixtures
          TEST_RUNNER_LW_INFERENCE_LIBRARY: ${{ github.workspace }}/.build/xcode-app/Build/Products/Debug/LensWorks.app/Contents/Helpers/liblensworks_inference.dylib
          # S40: the stdio MCP bridge the automation tests launch as an MCP client would.
          TEST_RUNNER_LW_MCP_BRIDGE: ${{ github.workspace }}/.build/rust-catalog/release/lensworks-mcp
        run: |
          # The shared catalog bootstrap built the 100k fixture probe alongside the helpers.
          test -x "$TEST_RUNNER_LW_CATALOG_TEST_ORGANIZATION_PROBE"
          # The S06 UI test opens a catalog whose source folder was disconnected (moved) after import;
          # the sandboxed UI runner cannot move files, so the fixture owner prepares it here.
          s06="$TEST_RUNNER_LW_S38_FIXTURE_ROOT/S06"
          mkdir -p "$s06" && mkdir -m 700 "$s06/WorkingVersions"
          cp -R "$TEST_RUNNER_LW_S38_FIXTURE_ROOT/photos" "$s06/Photos"
          # Catalog preferences (last catalog, import checkpoint) go to a throwaway suite and the pinned window frame
          # disables frame autosave, so this launch writes nothing to the app's own defaults domain.
          suite="net.trefry.lensworks.ci-s06-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'defaults delete "$suite" >/dev/null 2>&1 || true; rm -f "$HOME/Library/Preferences/$suite.plist"' EXIT
          .build/xcode-app/Build/Products/Debug/LensWorks.app/Contents/MacOS/LensWorks --lensworks-catalog "$s06/Demo.catalog" --lensworks-create-catalog \
            --lensworks-import "$s06/Photos" --lensworks-evidence "$s06/import-evidence.json" --lensworks-defaults-suite "$suite" --lensworks-quit -ApplePersistenceIgnoreState YES \
            -LensWorksPinnedWindowFrame '{{0, 0}, {1280, 800}}'
          python3 -c 'import json, sys; e = json.load(open(sys.argv[1])); assert e["assetCount"] == 8 and not e["error"], e' "$s06/import-evidence.json"
          mv "$s06/Photos" "$s06/Moved Photos"
          # Swift Testing results do not appear in XCTest's "Executed N tests"
          # line; the wrapper checks the bundle and fails unless every filter
          # below matched tests that passed, or on a refused UI automation mode.
          ./scripts/ci/xcodebuild_test.sh NativeTests.xcresult -project native/Compositor.xcodeproj -scheme Compositor -destination 'platform=macOS,arch=arm64' -derivedDataPath .build/xcode-s47 -parallel-testing-enabled NO \
            '-only-testing:CompositorTests/LensWorksCatalogBrowserTests/largeSyntheticCatalogNavigationSelectionAndEditorTransitionStayWindowed()' \
            '-only-testing:CompositorTests/LensWorksCatalogBrowserTests/largeSyntheticCatalogMetadataFilterKeywordAndCollectionQueriesStayWindowed()' \
            '-only-testing:CompositorTests/LensWorksCatalogBrowserTests/organizationControlsApplyToSingleAndSelectedPhotosUndoAndPersistAcrossRestart()' \
            '-only-testing:CompositorTests/LensWorksCatalogBrowserTests/organizationUndoIsExactSkipsLaterChangesAndRestoresPositions()' \
            '-only-testing:CompositorTests/LensWorksCatalogBrowserTests/keywordRenameMoveDeleteAndSynonymsFollowNestedKeywordsAndUndo()' \
            '-only-testing:CompositorTests/LensWorksCatalogBrowserTests/offlineSourceBrowsesOrganizesAndRelinksWithoutChangingIdentity()' \
            -only-testing:CompositorTests/CommandRegistryTests \
            -only-testing:CompositorTests/LensWorksAutomationTests \
            -only-testing:CompositorTests/LensWorksAgentCommandTests \
            -only-testing:CompositorTests/LensWorksUserStateTests \
            -only-testing:CompositorUITests/CompositorUITests/testS38LayerMenuAndEffectiveShortcutShareVisibilityAndSingleUndo \
            -only-testing:CompositorUITests/CompositorUITests/testS38OpacityLiveBurstCoalescesAndEscapePreservesStartingHistory \
            -only-testing:CompositorUITests/CompositorUITests/testS38DisabledRegisteredLayerMenuDisplaysTransformReason \
            -only-testing:CompositorUITests/CompositorUITests/testS05CatalogOrganizationMenusChangeSelectedPhotoAndUndoRedo \
            -only-testing:CompositorUITests/CompositorUITests/testS06OfflineSourceOrganizesAndFolderRelinkAppliesAndUndoes \
            -only-testing:CompositorUITests/CompositorUITests/testS24AIModelsWindowShowsStatesAndExplicitDownloadSheet
      - name: Deliver the source-declared measured screenshot tolerance
        run: |
          python3 -m unittest scripts.tests.test_load_s47_screenshot_tolerance
          python3 scripts/ci/load_s47_screenshot_tolerance.py
      - name: Run two complete unattended native UI tours and compare their retained captures
        env:
          TEST_RUNNER_LW_S47_FIXTURE_ROOT: ${{ runner.temp }}/s47-fixtures
          TEST_RUNNER_LW_S47_CAPTURE_ROOT: ${{ runner.temp }}/s47-captures
          TEST_RUNNER_LW_CATALOG_TEST_WORKER: ${{ github.workspace }}/.build/rust-catalog/release/photocatalog
          TEST_RUNNER_LW_CATALOG_TEST_DECODE_WORKER: ${{ github.workspace }}/.build/rust-catalog/release/lensworks-decode-worker
        run: |
          set -euo pipefail
          test -n "$TEST_RUNNER_LW_S47_MAX_CHANNEL_DELTA"
          test -n "$TEST_RUNNER_LW_S47_MAX_CHANGED_PIXEL_FRACTION"
          fixtures=$TEST_RUNNER_LW_S47_FIXTURE_ROOT
          working=$fixtures/WorkingVersions
          mkdir -m 700 "$TEST_RUNNER_LW_S47_CAPTURE_ROOT"
          xcode=(-project native/Compositor.xcodeproj -scheme Compositor -destination 'platform=macOS,arch=arm64' -derivedDataPath .build/xcode-s47 -parallel-testing-enabled NO)
          tour=-only-testing:CompositorUITests/CompositorUITests/testS47DeterministicDemoCatalogTourOpensPhotoEditorAndRetainsItsCapture
          # Each tour is its own invocation on the same WorkingVersions path, so the sidebar shows one identical
          # working-version folder in both captures. Each keeps its own result bundle; its capture, window-domain
          # record and tour record are exported from that exact bundle for the comparison.
          TEST_RUNNER_LW_S47_TOUR_RUN=1 ./scripts/ci/xcodebuild_test.sh S47UITour1.xcresult "${xcode[@]}" "$tour"
          python3 scripts/ci/export_s47_tour_capture.py S47UITour1.xcresult 1 "$TEST_RUNNER_LW_S47_CAPTURE_ROOT"
          # The sandboxed UI runner cannot move files: the fixture owner retains tour 1's working folder and gives
          # tour 2 a new real, empty, private folder at the same path.
          mv "$working" "$fixtures/WorkingVersions-tour1"
          mkdir -m 700 "$working"
          TEST_RUNNER_LW_S47_TOUR_RUN=2 ./scripts/ci/xcodebuild_test.sh S47UITour2.xcresult "${xcode[@]}" "$tour"
          python3 scripts/ci/export_s47_tour_capture.py S47UITour2.xcresult 2 "$TEST_RUNNER_LW_S47_CAPTURE_ROOT"
          mv "$working" "$fixtures/WorkingVersions-tour2"
          ./scripts/ci/xcodebuild_test.sh S47UICompare.xcresult "${xcode[@]}" \
            -only-testing:CompositorUITests/CompositorUITests/testS47DeterministicDemoCatalogToursCompareConsecutiveRetainedScreenshots
      - name: Upload tour evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s47-procedural-ui-tour
          path: |
            S47UITour1.xcresult
            S47UITour2.xcresult
            S47UICompare.xcresult
            ${{ runner.temp }}/s47-captures
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: native-tests, path: NativeTests.xcresult, if-no-files-found: ignore, retention-days: 7}
      - name: Upload command audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: command-audit, path: CommandAudit.xcresult, if-no-files-found: ignore, retention-days: 7}
