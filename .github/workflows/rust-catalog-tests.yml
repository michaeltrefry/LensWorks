name: Rust catalog engine and adapter tests
on:
  pull_request: {}
  push:
    branches: [main]
    # The code graph document is regenerated after every merge; it changes no build input.
    paths-ignore: [CODEGRAPH.md]
permissions: {contents: read}
# One runner serves every workflow, so a newer push to a pull request replaces its older runs.
# Pushes to main are grouped by commit and never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  cargo-test:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 4
      MACOSX_DEPLOYMENT_TARGET: "26.2"
    steps:
      - uses: actions/checkout@v4
        # The engine and adapter build only from in-tree sources; the
        # vendor/Compositor submodule is not part of either cargo build.
        with: {submodules: false}
      - name: Use persistent runner caches for the SDK and cargo target
        # Outside the workspace (which checkout cleans) so the self-hosted
        # runner reuses the download and builds incrementally.
        run: |
          cache="$HOME/.cache/lensworks-ci"
          mkdir -p "$cache"
          echo "CARGO_TARGET_DIR=$cache/rust-tests-target" >> "$GITHUB_ENV"
          python3 engines/catalog/scripts/fetch_dng_sdk.py --destination "$cache/deps"
          echo "PHOTOCATALOG_DNG_SDK=$cache/deps/dng_sdk_1_7_1_2724/dng_sdk_1_7_1" >> "$GITHUB_ENV"
      - name: Engine tests
        timeout-minutes: 40
        run: cargo test --manifest-path engines/catalog/Cargo.toml --locked
      - name: Engine maximum-size Source fixtures (serial, production deadline)
        timeout-minutes: 20
        # Excluded from the parallel run above so their 120 s per-query production
        # deadline measures the Source path, not contention from other tests.
        run: cargo test --manifest-path engines/catalog/Cargo.toml --locked --lib -- --ignored --test-threads=1 proxy::budget_tests
      - name: Adapter tests
        timeout-minutes: 30
        run: cargo test --manifest-path adapters/catalog/Cargo.toml --locked
      - name: MCP bridge tests
        timeout-minutes: 10
        run: cargo test --manifest-path adapters/mcp/Cargo.toml --locked
      - name: Filter-plugin sandbox tests, and the sample plugins rebuilt from source
        timeout-minutes: 10
        # The sandbox's limits and refusals (forbidden imports, endless loops, recursion, memory bombs, traps,
        # out-of-bounds writes, malformed modules), and that every committed sample filter.wasm is byte-for-byte
        # what its filter.wat assembles to with the pinned assembler (scripts/build-sample-plugins.sh).
        run: cargo test --manifest-path adapters/plugins/Cargo.toml --locked
