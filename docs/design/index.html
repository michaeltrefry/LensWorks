<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LensWorks · interaction study</title>
<style>
:root{color-scheme:dark;--bg:#242424;--panel:#2c2c2c;--line:#424242;--text:#e7e7e7;--muted:#a6a6a6;--accent:#91b7d8;--header:42px;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#181818;color:var(--text)}button,input,select,textarea{font:inherit;color:inherit}button{border:1px solid transparent;border-radius:5px;background:transparent;padding:7px 9px;cursor:pointer}button:hover{background:#ffffff12}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.active{background:#ffffff1f!important}.primary{background:#d6e6f2;color:#18212a;font-weight:600}.primary:hover{background:#e8f2fa}.muted{color:var(--muted)}.small{font-size:11px}.mono{font:11px ui-monospace,SFMono-Regular,monospace}.pill{border:1px solid #566573;border-radius:4px;padding:2px 5px;color:#bad0e0;font-size:10px}
.study{height:30px;background:#151515;display:flex;align-items:center;justify-content:space-between;padding:0 15px;color:#999;font-size:11px}.study a{color:#b7cad9}.window{height:calc(100dvh - 30px);min-height:670px;display:flex;flex-direction:column}header{height:var(--header);min-height:var(--header);background:#303030;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 14px}.traffic{display:flex;gap:6px;margin-right:8px}.traffic i{width:11px;height:11px;background:#666;border-radius:50%}.brand{font-size:13px;font-weight:600}.header-title{color:#a5a5a5}.spacer{flex:1}.search{width:230px;background:#222;border:1px solid #484848;border-radius:5px;padding:5px 9px}.work{flex:1;display:flex;min-height:0}.sidebar{width:186px;min-width:186px;background:#292929;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 10px 10px}.sidebar h2,.pane h2{font-size:11px;color:#aaa;font-weight:500;margin:17px 8px 7px}.nav{width:100%;display:flex;gap:9px;align-items:center;text-align:left;padding:8px}.nav span:last-child{margin-left:auto;color:#8c8c8c}.sidebar .bottom{margin-top:auto;padding:12px 8px;border-top:1px solid var(--line)}.sidebar .bottom p{line-height:1.6;margin:5px 0}.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}.toolbar{height:42px;min-height:42px;display:flex;align-items:center;gap:5px;padding:0 12px;border-bottom:1px solid var(--line);background:#2b2b2b}.toolbar strong{font-size:13px;font-weight:600}.catalog-body{flex:1;display:flex;min-height:0}.gridwrap{flex:1;overflow:auto;padding:22px}.heading{display:flex;align-items:end;justify-content:space-between;margin:0 0 20px}.heading h1{font-size:21px;font-weight:500;margin:0 0 5px}.heading p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px 15px}.card{background:#282828;border:1px solid transparent;border-radius:5px;overflow:hidden;padding:5px;text-align:left;position:relative}.card.selected{border-color:#a4bdd1;background:#3a4147}.card .thumb{height:137px;background:#202020;display:flex;align-items:center;justify-content:center;overflow:hidden}.card svg{height:100%;width:100%;object-fit:cover}.card .caption{padding:9px 5px 3px;display:flex;justify-content:space-between;gap:6px}.card .caption strong{font-weight:500}.card .detail{padding:0 5px 5px;color:#929292;font-size:10px}.stars{color:#c4c4c4;letter-spacing:2px}.catalog-inspector{width:245px;min-width:245px;background:#2c2c2c;border-left:1px solid var(--line);padding:0 12px;overflow:auto}.sectionhead{height:42px;display:flex;align-items:center;font-size:13px;font-weight:600;border-bottom:1px solid var(--line)}.info{display:grid;grid-template-columns:70px 1fr;gap:10px;margin:16px 0;font-size:11px;line-height:1.4}.info dt{color:#999}.info dd{margin:0;overflow-wrap:anywhere}.version{display:flex;width:100%;text-align:left;justify-content:space-between;padding:10px 7px;margin:3px 0}.statusbar{height:30px;min-height:30px;display:flex;align-items:center;gap:18px;padding:0 12px;border-top:1px solid var(--line);background:#292929;font:11px ui-monospace,SFMono-Regular,monospace;color:#aaa}
.editor{flex:1;display:flex;min-height:0}.tools{width:56px;min-width:56px;border-right:1px solid var(--line);background:#292929;padding:10px;display:flex;flex-direction:column;gap:6px}.tools button{width:36px;height:36px;padding:5px;font-size:19px}.tools .divider{height:1px;background:#484848;margin:4px 0}.canvas-area{flex:1;min-width:0;background:#242424;display:flex;flex-direction:column;position:relative}.canvas{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;background-image:radial-gradient(#ffffff06 1px,transparent 1px);background-size:12px 12px}.art{width:100%;max-width:790px;max-height:100%;aspect-ratio:1.5;box-shadow:0 5px 25px #0007;position:relative;overflow:hidden}.art svg{width:100%;height:100%;display:block}.canvas-label{position:absolute;left:15px;top:12px;color:#9a9a9a;font-size:10px}.selection{position:absolute;inset:40% 32% 12% 25%;border:1px dashed white;border-radius:50%;box-shadow:0 0 0 1px #0004}.ai-overlay{position:absolute;inset:0;background:linear-gradient(140deg,transparent 45%,#cfb48624 80%);mix-blend-mode:screen;pointer-events:none}.filmstrip{height:111px;min-height:111px;border-top:1px solid var(--line);background:#2a2a2a;display:flex;gap:8px;align-items:center;padding:10px 14px;overflow-x:auto}.film{padding:4px;width:91px;min-width:91px;border:1px solid transparent;border-radius:4px}.film.active{border-color:#adc6d9}.film svg{width:81px;height:58px;display:block}.film span{display:block;text-align:left;font-size:9px;margin-top:5px;white-space:nowrap;overflow:hidden}.pane{background:#2d2d2d;border-left:1px solid var(--line);width:244px;min-width:244px;overflow:auto}.pane .inner{padding:12px}.pane .sectionhead{padding:0 12px;justify-content:space-between}.pane label.row{display:flex}.pane label{display:block;font-size:11px;color:#bbb;margin:12px 0 6px}.pane select,.pane textarea,.pane input[type=text],.pane input[type=number]{width:100%;background:#232323;border:1px solid #4b4b4b;padding:7px;border-radius:4px}.pane textarea{height:98px;resize:vertical;line-height:1.5}.row{display:flex;justify-content:space-between;align-items:center}.slider{width:100%;accent-color:#c0d4e4}.rule{border-top:1px solid var(--line);margin:16px -12px 12px}.layer{display:flex;align-items:center;gap:7px;padding:8px 3px;border-bottom:1px solid #ffffff08}.layer .tile{width:29px;height:25px;background:#525c63;border:1px solid #667079;border-radius:2px}.layer .name{flex:1;font-size:11px}.layer button{padding:3px}.layer .sub{font-size:9px;color:#9d9d9d;margin-top:3px}.layer.hidden{opacity:.45}.layer .eye{width:23px}.full{width:100%}.hint{font-size:10px;color:#aaa;line-height:1.5}.ai-pane.floating{position:absolute;right:259px;top:53px;height:calc(100% - 177px);z-index:4;border:1px solid #666;border-radius:8px;box-shadow:0 12px 40px #0007}.advanced{margin:12px 0}.advanced summary{cursor:pointer;font-size:11px;color:#aaa}.progress{margin:12px 0;padding:12px;background:#232323;border:1px solid #4b4b4b;border-radius:5px}.progress progress{width:100%;accent-color:#b3cde0;height:5px;margin:10px 0}.draft-banner{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;padding:8px 12px;background:#252525ee;border:1px solid #555;border-radius:5px;font-size:11px;white-space:nowrap}.checkpoint{display:block;padding:7px 4px;color:#bbb;font-size:11px}.toast{position:fixed;left:50%;bottom:45px;transform:translateX(-50%);background:#e0e9ef;color:#202830;box-shadow:0 4px 18px #0006;padding:10px 17px;border-radius:6px;z-index:10;font-size:12px}dialog{border:1px solid #626262;border-radius:10px;background:#303030;color:#eee;width:400px;padding:22px;box-shadow:0 20px 80px #0008}dialog::backdrop{background:#0008}dialog h2{font-size:17px;font-weight:500;margin:0 0 13px}dialog p{color:#bbb;font-size:12px;line-height:1.6}dialog label{display:block;margin:12px 0 5px;color:#ccc}dialog input,dialog select{width:100%;padding:8px;background:#222;border:1px solid #555;border-radius:4px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.empty{margin:35px auto;color:#aaa;text-align:center}.batchtray{border-top:1px solid var(--line);padding:10px 12px;background:#293139;display:flex;align-items:center;gap:10px}.batchtray progress{width:90px;accent-color:#bdd6e9}.chip{font-size:10px;background:#ffffff12;border-radius:3px;padding:3px 5px} .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:1200px){.sidebar{width:160px;min-width:160px}.pane{width:218px;min-width:218px}.catalog-inspector{width:220px;min-width:220px}.ai-pane.floating{right:230px}.search{width:170px}}@media(max-width:950px){.sidebar{width:140px;min-width:140px}.catalog-inspector{display:none}.pane{width:200px;min-width:200px}.ai-pane{position:absolute;right:210px;top:53px;max-height:calc(100% - 177px);border:1px solid #555;z-index:4;box-shadow:0 10px 30px #0008}.header-title{display:none}.search{width:130px}}
</style>
</head>
<body><div class="study"><span>INTERACTION STUDY · sample illustrations · simulated AI · browser-local recovery</span><span><button data-action="reset">Reset study</button> <a href="README.md">Scope &amp; review notes</a></span></div><div id="app"></div><div id="notice" role="status" aria-live="polite"></div><dialog id="modal"></dialog>
<script>
const STORE='lensworks-interaction-study-v1';
const initial={view:'catalog',folder:'All photos',selected:1,version:'Working',aiOpen:true,docked:true,tool:'Move',selection:false,task:'Generative fill',prompt:'Remove the small boat; keep the reflections natural.',exposure:0,temperature:5400,layers:[{name:'Local contrast',kind:'Adjustment',visible:true},{name:'Clone / heal',kind:'Editable strokes',visible:true},{name:'RAW source',kind:'Live development',visible:true}],checkpoints:[],past:[],future:[],draft:null,saved:[],batch:null,job:null,generated:false};
let state;try{state={...structuredClone(initial),...JSON.parse(localStorage.getItem(STORE)||'null')}}catch{state=structuredClone(initial)}state.job=null;
let jobTimer=null,batchTimer=null,toastTimer=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem(STORE,JSON.stringify(state))}
const photos=Array.from({length:12},(_,i)=>({id:i+1,name:['Alpine lake','Morning ridge','Quiet shore','Mist in the valley','Pine forest','Last light','Blue hour','Still water','Rocky coast','High country','Coastal road','Evening clouds'][i],file:`DSC_${String(1842+i).padStart(4,'0')}.NEF`,folder:i<8?'Alpine trip':'Coast',rating:i<3?5:i<7?4:3}));
function illustration(id=1){const hues=['#8ba3a8','#aaafa0','#879999','#9eabb2','#758d88','#bba18b'];const sky=hues[(id-1)%6];return `<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustrative mountain lake"><defs><linearGradient id="s${id}" x2="0" y2="1"><stop stop-color="${sky}"/><stop offset="1" stop-color="#d6d4bd"/></linearGradient><linearGradient id="l${id}" x2="0" y2="1"><stop stop-color="#789697"/><stop offset="1" stop-color="#314f54"/></linearGradient></defs><path fill="url(#s${id})" d="M0 0h600v400H0z"/><path fill="#71807d" d="M0 184 75 134 120 164 204 72 291 169 342 113 405 170 476 94 600 180v132H0z"/><path fill="#c2c6ba" d="m204 72-45 49 30-7 12 18 15-28 23 22zM476 94l-27 37 29-10 26 11z"/><path fill="#3e5a58" d="m0 210 87-33 113 55 85-18 68-51 97 36 65-39 85 61v91H0z"/><path fill="url(#l${id})" d="M0 256q80-20 160 0t140 3 140-5 160 0v146H0z"/><path fill="#435c57" opacity=".7" d="m0 277 87 22 113-21 85 8 68 32 97-20 65 27 85-40v22l-100 30-80-27-50 30-96-39-68 20-131-24L0 317z"/><g stroke="#b3c4ba" stroke-width="1" opacity=".3"><path d="M90 320h200M250 347h240M24 363h150M370 284h110M135 303h145"/></g><path fill="#213b34" d="M0 260v140h60l-8-43 19 3-28-34 19 2-25-30 15 2-29-55-22 54 13-2zM574 283l-25 50 13-2-24 28 17-3-22 34 23-3-6 13h50V281l-10 22z"/><path fill="#ddded2" opacity=".7" d="M300 273q40-7 62 0l-22 3z"/></svg>`}
function toast(message){clearTimeout(toastTimer);document.getElementById('notice').innerHTML=`<div class="toast">${esc(message)}</div>`;toastTimer=setTimeout(()=>document.getElementById('notice').innerHTML='',3300)}
function current(){return photos.find(p=>p.id===state.selected)||photos[0]}
function nav(label,icon,count){return `<button class="nav ${state.folder===label?'active':''}" data-action="folder" data-value="${label}"><span aria-hidden="true">${icon}</span>${label}<span>${count}</span></button>`}
function side(){return `<aside class="sidebar" aria-label="Catalog navigation"><div class="brand" style="padding:4px 8px 10px">Travel library</div>${nav('All photos','▦',12+state.saved.length)}${nav('Favorites','☆',3)}<h2>SOURCE FOLDERS</h2>${nav('Alpine trip','▱',8)}${nav('Coast','▱',4)}<h2>CATALOG FOLDERS</h2>${nav('Generated','✧',state.saved.filter(p=>p.folder==='Generated').length)}${nav('Portfolio','▱',state.saved.filter(p=>p.folder==='Portfolio').length)}${nav('Compositions','▧',1+state.saved.filter(p=>p.folder==='Compositions').length)}<div class="bottom"><div class="row small"><span>Source volume</span><span style="color:#9bb89c">● Online</span></div><p class="small muted">Photos RAID<br><span class="mono">/Volumes/Photos</span></p><p class="small muted">Catalog &amp; previews · local SSD</p><button class="full" data-action="standalone">Open sample document</button></div></aside>`}
function header(){return `<header><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><span class="brand">LensWorks</span><span class="header-title">/ Travel library</span><div class="spacer"></div><label class="sr" for="search">Search sample catalog</label><input id="search" class="search" type="search" placeholder="Search photos…" value="${esc(state.search||'')}"><button data-action="catalog" class="${state.view==='catalog'?'active':''}">Catalog</button><button data-action="new" class="${state.view==='generation'?'active':''}">✧ Generate</button></header>`}
function cards(){let rows=['Generated','Portfolio','Compositions'].includes(state.folder)?[...(state.folder==='Compositions'?[{id:90,name:'Alpine triptych',file:'Composition · 3 linked sources',folder:'Compositions',rating:0}]:[]),...state.saved.filter(p=>p.folder===state.folder)]:photos.filter(p=>state.folder==='Favorites'?p.rating===5:state.folder==='All photos'?true:p.folder===state.folder);if(state.folder==='All photos')rows=[...rows,...state.saved];rows=rows.filter(p=>(p.name+' '+p.file).toLowerCase().includes((state.search||'').toLowerCase()));return rows.length?rows.map(p=>`<button class="card ${state.selected===p.id?'selected':''}" data-action="photo" data-value="${p.id}" aria-label="Select ${esc(p.name)}"><div class="thumb">${illustration(p.id)}</div><div class="caption"><strong>${esc(p.name)}</strong>${p.id>12?'<span class="pill">'+(p.id===90?'COMP':p.file==='Layered document'?'DOC':'AI')+'</span>':'<span class="pill">RAW</span>'}</div><div class="detail">${esc(p.file)}</div><div class="detail stars">${'★'.repeat(p.rating||0)}${p.id===1?' <span class="chip">3 versions</span>':''}</div></button>`).join(''):'<div class="empty">No matching photos.</div>'}
function inspector(){const p=current();return `<aside class="catalog-inspector" aria-label="Photo details"><div class="sectionhead">${esc(p.name)}</div><dl class="info"><dt>Original</dt><dd>${p.file}</dd><dt>Camera</dt><dd>Nikon Z8</dd><dt>Dimensions</dt><dd>8256 × 5504</dd><dt>Location</dt><dd>Photos RAID / ${p.folder}</dd><dt>Source</dt><dd>Untouched original</dd></dl><div class="sectionhead">Versions</div>${['Working','Warm light','Black & white'].map(v=>`<button class="version ${state.version===v?'active':''}" data-action="version" data-value="${v}"><span>◧ &nbsp;${v}</span><span class="muted">›</span></button>`).join('')}<button class="full" data-action="add-version">＋ New named version</button><div class="sectionhead" style="margin-top:16px">Source relationships</div><p class="hint">One catalog photo. Each version owns its RAW settings and layers.</p><button class="primary full" data-action="edit">Open in editor</button></aside>`}
function batch(){const b=state.batch;if(!b)return '';return `<div class="batchtray" aria-live="polite"><span>✧</span><span>${b.done===b.total?'Batch complete':'Upscaling sample selection'} · ${b.done}/${b.total}</span><progress value="${b.done}" max="${b.total}"></progress><span class="muted small">${b.paused?'Paused · recovery saved':b.done===b.total?'Results retained':'New versions · simulated'}</span><div class="spacer"></div>${b.done<b.total?`<button data-action="batch-${b.paused?'resume':'pause'}">${b.paused?'Resume':'Cancel remaining'}</button>`:'<button data-action="batch-clear">Dismiss</button>'}</div>`}
function catalog(){return `<div class="main"><div class="toolbar"><strong>${esc(state.folder)}</strong><div class="spacer"></div><span class="muted small">Double-click a photo to edit</span><button data-action="batch">✧ Batch · 3 favorites</button></div><div class="catalog-body"><div class="gridwrap"><div class="heading"><div><h1>${esc(state.folder==='All photos'?'Photo library':state.folder)}</h1><p>${state.folder==='Generated'?'Saved generated images, alongside the rest of your library.':'Originals, versions and compositions in one library.'}</p></div><span class="muted small">Name ↑</span></div><div id="photo-grid" class="grid">${cards()}</div></div>${inspector()}</div>${batch()}<div class="statusbar"><span>Travel library</span><span>12 source photographs</span><div class="spacer"></div><span>Sample catalog · no files modified</span></div></div>`}
function tools(){return `<aside class="tools" aria-label="Editing tools">${[['Move','↖'],['Select','▱'],['Brush','⌁'],['Heal','✚'],['Crop','⌗']].map(([name,icon])=>`<button title="${name}" aria-label="${name}" aria-pressed="${state.tool===name}" class="${state.tool===name?'active':''}" data-action="tool" data-value="${name}">${icon}</button>`).join('')}<div class="divider"></div><button aria-label="Select subject" title="Select subject" data-action="subject">♙</button><button aria-label="Remove background" title="Remove background" data-action="background">◌</button></aside>`}
function rawLayers(){return `<aside class="pane" aria-label="RAW and layers"><div class="sectionhead">RAW development <span class="pill">LIVE</span></div><div class="inner"><div class="row small"><span class="muted">${current().file}</span><span>◇</span></div><label for="exposure" class="row"><span>Exposure</span><output id="exposure-value">${Number(state.exposure).toFixed(2)}</output></label><input id="exposure" class="slider" type="range" min="-2" max="2" step=".05" value="${state.exposure}"><label for="temperature" class="row"><span>Temperature</span><output id="temperature-value">${state.temperature} K</output></label><input id="temperature" class="slider" type="range" min="3000" max="8000" step="100" value="${state.temperature}"><p class="hint">RAW changes update sampled retouch strokes. Generated layers keep their own pixels.</p></div><div class="sectionhead">Layers <span class="small muted">${state.layers.length}</span></div><div class="inner" style="padding-top:5px"><div class="row small" style="margin:4px 0 7px"><span class="muted">Normal</span><span>Opacity 100%</span></div>${state.layers.map((l,i)=>`<div class="layer ${l.visible?'':'hidden'}"><button class="eye" aria-label="${l.visible?'Hide':'Show'} ${esc(l.name)}" data-action="visibility" data-value="${i}">${l.visible?'●':'○'}</button><div class="tile" aria-hidden="true"></div><div class="name">${esc(l.name)}<div class="sub">${esc(l.kind)}</div></div>${l.kind==='Live development'?'':`<button aria-label="Delete ${esc(l.name)}" data-action="delete" data-value="${i}">×</button>`}</div>`).join('')}<div class="rule"></div><div class="row"><span class="muted">Checkpoints</span><button aria-label="Create checkpoint" data-action="checkpoint">＋</button></div>${state.checkpoints.length?state.checkpoints.map((c,i)=>`<button class="checkpoint full" style="text-align:left" data-action="restore" data-value="${i}">◇ ${esc(c.name)}</button>`).join(''):'<p class="hint">Name a point you want to return to.</p>'}</div></aside>`}
function ai(){const gen=state.view==='generation';const task=gen?'Generate image':state.task;return `<aside class="pane ai-pane ${state.docked?'':'floating'}" aria-label="AI panel"><div class="sectionhead">✧ AI <div><button aria-label="${state.docked?'Float':'Dock'} AI panel" data-action="dock">${state.docked?'↗':'↙'}</button><button aria-label="Close AI panel" data-action="ai">×</button></div></div><div class="inner"><label for="task">Task</label><select id="task">${(gen?['Generate image']:['Generative fill','Prompt editing','Upscale','Restore','Caption & keywords']).map(t=>`<option ${task===t?'selected':''}>${t}</option>`).join('')}</select><label for="model">Compatible model</label><select id="model"><option>Example ${task==='Upscale'?'upscaling':task==='Caption & keywords'?'captioning':'image'} model</option></select><p class="hint">Model already available · shared library<br>Model choices in this study are illustrative.</p><label for="prompt">${task==='Caption & keywords'?'Instructions':'Prompt'}</label><textarea id="prompt">${esc(state.prompt)}</textarea>${!gen?`<div class="row small" style="margin-top:10px"><span class="muted">Input</span><span>${state.selection?'Current selection':'Visible image'}</span></div>`:''}<details class="advanced"><summary>Advanced controls</summary><label for="seed">Seed</label><input id="seed" type="number" value="42"><label for="steps">Steps</label><input id="steps" type="number" value="20"></details>${state.job?`<div class="progress"><div class="row"><span>${gen?'Generating':'Editing'}…</span><span>${state.job.progress}%</span></div><progress value="${state.job.progress}" max="100"></progress><button class="full" data-action="cancel">Cancel</button></div>`:`<button class="primary full" data-action="run">${gen?'Generate image':'Run '+esc(task.toLowerCase())}</button>`}<p class="hint">${gen?'A recoverable draft. Choose a catalog folder on first Save.':'Successful edits appear as new layers. Hide or delete a result at any time.'}</p></div></aside>`}
function filmstrip(){return `<div class="filmstrip" aria-label="Catalog filmstrip">${photos.slice(0,8).map(p=>`<button class="film ${state.selected===p.id?'active':''}" data-action="film" data-value="${p.id}" aria-label="Open ${p.name}">${illustration(p.id)}<span>${p.name}</span></button>`).join('')}</div>`}
function editor(){const gen=state.view==='generation',stand=state.view==='standalone';return `<div class="main"><div class="toolbar"><strong>${gen?'Untitled generation':stand?'Coastal study':current().name}</strong><span class="muted">/ ${gen?'Recoverable draft':stand?'Standalone document':esc(state.version)}</span><div class="spacer"></div>${gen?`<button class="primary" data-action="save" ${state.generated?'':'disabled'}>Save to catalog…</button>`:stand?'<button class="primary" data-action="add-catalog">Add to Catalog…</button>':`<button data-action="checkpoint">◇ Checkpoint</button>`}<button aria-label="Undo" data-action="undo" ${state.past.length?'':'disabled'}>↶</button><button aria-label="Redo" data-action="redo" ${state.future.length?'':'disabled'}>↷</button><button class="${state.aiOpen?'active':''}" data-action="ai">✧ AI</button></div><div class="editor">${tools()}<div class="canvas-area"><div class="canvas-label">${gen?'GENERATED DRAFT':'DOCUMENT'} · Illustrative canvas</div><div class="canvas">${gen&&!state.generated?'<div class="empty"><div style="font-size:32px;margin-bottom:15px">✧</div><div style="font-size:17px;color:#ddd">Start with an idea</div><p>Choose a task and prompt in the AI panel.</p></div>':`<div class="art" style="filter:brightness(${1+Number(state.exposure)*.12})">${illustration(state.selected)}${state.selection?'<div class="selection"></div>':''}${state.layers.some(l=>l.visible&&l.kind==='AI result')?'<div class="ai-overlay"></div>':''}</div>`}</div>${gen?'<div class="draft-banner">Not yet in catalog · draft retained on reload</div>':''}${!gen&&!stand?filmstrip():''}</div>${state.aiOpen?ai():''}${!gen?rawLayers():''}</div>${batch()}<div class="statusbar"><span>${gen?'Draft recovery saved':stand?'Standalone · recovery saved':'Working version · demo autosave saved'}</span><span>${state.tool}</span><div class="spacer"></div><span>History survives reload</span><span>Fit</span></div></div>`}
function render(){persist();document.getElementById('app').innerHTML=`<div class="window">${header()}<div class="work">${side()}${state.view==='catalog'?catalog():editor()}</div></div>`;bind()}
function snapshot(){return {layers:structuredClone(state.layers),exposure:state.exposure,temperature:state.temperature}}
function mutate(fn){state.past.push(snapshot());state.future=[];fn();render()}
function applySnapshot(s){state.layers=structuredClone(s.layers);state.exposure=s.exposure;state.temperature=s.temperature}
function dialog(title,body,submitLabel,onSubmit){const el=document.getElementById('modal');el.innerHTML=`<form id="dialog-form"><h2>${title}</h2>${body}<div class="actions"><button type="button" id="dialog-cancel">Cancel</button><button class="primary" type="submit">${submitLabel}</button></div></form>`;el.showModal();el.querySelector('#dialog-cancel').onclick=()=>el.close();el.querySelector('form').onsubmit=e=>{e.preventDefault();onSubmit(new FormData(e.target));el.close()};el.querySelector('input,select,button')?.focus()}
function saveDialog(standalone=false){dialog(standalone?'Add to Catalog':'Save generated image',`<p>${standalone?'Register this document with its history and source relationships.':'Save this draft as a catalog image. Future edits continue autosaving.'}</p><label for="save-name">Name</label><input id="save-name" name="name" required value="${standalone?'Coastal study':'Mountain light'}"><label for="save-folder">Catalog folder</label><select id="save-folder" name="folder"><option>Generated</option><option>Portfolio</option><option>Compositions</option></select><p class="hint">Virtual catalog grouping. Media uses the existing Photos RAID filesystem workflow.</p>`,standalone?'Add to Catalog':'Save',data=>{state.saved.push({id:101+state.saved.length,name:data.get('name'),file:standalone?'Layered document':'Generated image',folder:data.get('folder'),rating:0});state.draft=null;state.generated=false;state.folder=data.get('folder');state.view='catalog';render();toast(standalone?'Document added to catalog':'Image saved to '+data.get('folder'))})}
function run(){if(state.job)return;const generation=state.view==='generation',task=state.task;state.job={progress:0};render();jobTimer=setInterval(()=>{state.job.progress+=20;if(state.job.progress>=100){clearInterval(jobTimer);state.job=null;if(generation){state.generated=true;state.draft={prompt:state.prompt};render();toast('Generated draft ready · choose Save to catalog')}else if(task==='Caption & keywords'){render();dialog('Review metadata suggestions','<p>Caption: A quiet alpine lake beneath distant mountain peaks.</p><label><input name="keywords" type="checkbox" checked style="width:auto"> alpine, lake, mountains, reflection</label>','Apply suggestions',()=>toast('Sample metadata suggestions applied'))}else{mutate(()=>state.layers.unshift({name:task+' · AI',kind:'AI result',visible:true}));toast('Result added as a new layer')}}else render()},500)}
function tickBatch(){clearInterval(batchTimer);batchTimer=setInterval(()=>{if(!state.batch||state.batch.paused||state.batch.done>=state.batch.total){clearInterval(batchTimer);return}state.batch.done++;render()},1800)}
function action(a,v){if(a==='reset'){clearInterval(jobTimer);clearInterval(batchTimer);state=structuredClone(initial);toast('Study reset')}else if(a==='folder'){state.folder=v;state.view='catalog'}else if(a==='photo'){state.selected=+v}else if(a==='edit'||a==='version'){if(v)state.version=v;state.view='editor'}else if(a==='catalog'){state.view='catalog'}else if(a==='film'){state.selected=+v;state.view='editor'}else if(a==='new'){state.view='generation';state.aiOpen=true;state.prompt=state.draft?.prompt||'An alpine lake at first light, soft mist and calm reflections.'}else if(a==='standalone'){state.view='standalone';state.aiOpen=false}else if(a==='ai'){state.aiOpen=!state.aiOpen}else if(a==='dock'){state.docked=!state.docked}else if(a==='tool'){state.tool=v;state.selection=v==='Select';if(!['Move','Select'].includes(v))toast(v+' selected · this study demonstrates panel flow')}else if(a==='subject'){state.selection=true;toast('Sample subject selection ready')}else if(a==='background'){mutate(()=>state.layers.unshift({name:'Subject mask',kind:'Editable mask',visible:true}));toast('Editable subject mask added');return}else if(a==='visibility'){mutate(()=>state.layers[+v].visible=!state.layers[+v].visible);return}else if(a==='delete'){mutate(()=>state.layers.splice(+v,1));return}else if(a==='undo'){state.future.push(snapshot());applySnapshot(state.past.pop())}else if(a==='redo'){state.past.push(snapshot());applySnapshot(state.future.pop())}else if(a==='checkpoint'){dialog('Create checkpoint','<label for="checkpoint-name">Name</label><input id="checkpoint-name" name="name" required placeholder="Before sky edit">','Create',data=>{state.checkpoints.push({name:data.get('name'),snapshot:snapshot()});render();toast('Named checkpoint saved')});return}else if(a==='restore'){mutate(()=>applySnapshot(state.checkpoints[+v].snapshot));toast('Checkpoint restored · Undo is available');return}else if(a==='add-version'){dialog('New named version','<p>Start from the current RAW settings and layers.</p><label for="version-name">Name</label><input id="version-name" name="name" required placeholder="Soft evening">','Create',data=>{state.version=data.get('name');state.view='editor';render();toast('New version created in this study')});return}else if(a==='run'){run();return}else if(a==='cancel'){clearInterval(jobTimer);state.job=null;toast('AI job canceled')}else if(a==='save'){saveDialog();return}else if(a==='add-catalog'){saveDialog(true);return}else if(a==='batch'){state.batch={total:3,done:0,paused:false};tickBatch()}else if(a==='batch-pause'){state.batch.paused=true;clearInterval(batchTimer);toast('Remaining work canceled · completed results retained')}else if(a==='batch-resume'){state.batch.paused=false;tickBatch()}else if(a==='batch-clear'){state.batch=null}render()}
function bind(){document.querySelectorAll('[data-action]').forEach(el=>{el.onclick=()=>action(el.dataset.action,el.dataset.value);if(el.dataset.action==='photo')el.ondblclick=()=>{state.selected=+el.dataset.value;state.view='editor';render()}});document.getElementById('search').oninput=e=>{state.search=e.target.value;persist();const g=document.getElementById('photo-grid');if(g){g.innerHTML=cards();g.querySelectorAll('[data-action]').forEach(el=>{el.onclick=()=>action('photo',el.dataset.value);el.ondblclick=()=>{state.selected=+el.dataset.value;state.view='editor';render()}})}};const task=document.getElementById('task');if(task)task.onchange=e=>{state.task=e.target.value;render()};const prompt=document.getElementById('prompt');if(prompt)prompt.oninput=e=>{state.prompt=e.target.value;persist()};['exposure','temperature'].forEach(key=>{const el=document.getElementById(key);if(!el)return;let before;el.onpointerdown=()=>before=snapshot();el.oninput=e=>{if(!before)before=snapshot();state[key]=Number(e.target.value);document.getElementById(key+'-value').textContent=key==='exposure'?state[key].toFixed(2):state[key]+' K';const art=document.querySelector('.art');if(art)art.style.filter=`brightness(${1+state.exposure*.12})`;persist()};el.onchange=()=>{if(before){state.past.push(before);state.future=[];before=null}render()}})}
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select')||document.getElementById('modal').open)return;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();if(e.shiftKey&&state.future.length)action('redo');else if(!e.shiftKey&&state.past.length)action('undo')}});
if(state.batch&&!state.batch.paused&&state.batch.done<state.batch.total){state.batch.paused=true}
render();
</script></body></html>
