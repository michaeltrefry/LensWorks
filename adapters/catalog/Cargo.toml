[package]
name = "lensworks-catalog"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "lensworks_catalog"
crate-type = ["staticlib", "rlib"]

[dependencies]
photocatalog = { path = "../../vendor/PhotoCatalog" }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }

# Preserve PhotoCatalog's private SQLite identity patch. Cargo only applies
# patch declarations from the root crate, never from a dependency manifest.
[patch.crates-io]
libsqlite3-sys = { path = "../../vendor/PhotoCatalog/vendor/libsqlite3-sys" }
