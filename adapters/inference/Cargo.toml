[package]
name = "lensworks-inference"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "lensworks_inference"
# cdylib: loaded at runtime by the native app (see README); rlib: Rust tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
# SceneWorks inference macOS runtime bundle, retained unmodified (E2). The revision is
# pinned in DEPENDENCIES.json and verified by scripts/verify-dependencies.py. The media
# lane only: the Candle audio lane is not composed into this photography product.
runtime-macos = { git = "https://github.com/SceneWorks/inference", rev = "25bd55cdb6a56c78b07584a12150c9f5d46be439", default-features = false, features = ["media"] }
# Same fork/revision the pinned inference workspace uses (one unified mlx-sys build); needed to
# read the SAM bespoke utilities' MLX array outputs and build their input tensors.
mlx-rs = { package = "pmetal-mlx-rs", git = "https://github.com/michaeltrefry/mlx-rs", rev = "48ff5e78a49e0a513f1976b0b1af70f9a5305f00" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false }

[dev-dependencies]
tempfile = "3"
